hydra:
  run:
    dir: ./il_outputs/${policy_name}/${task_name}/${exp_name}
  sweep:
    dir: ./il_outputs/${policy_name}/${task_name}/${exp_name}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - task_name=libero_90.kitchen_scene1_put_the_black_bowl_on_the_plate
    - exp_name=flash_bowl_s42_v1_20261028
    - dataset_config.zarr_path=./data_policy/libero_90.kitchen_scene1_put_the_black_bowl_on_the_plateFrankaL0_obs:joint_pos_act:joint_pos_ds4_40.zarr
    - train_config.training_params.seed=42
    - train_config.training_params.num_epochs=100
    - train_config.training_params.num_steps=15000
    - train_config.training_params.device=0
    - eval_config.policy_runner.obs.obs_type=joint_pos
    - eval_config.policy_runner.action.action_type=joint_pos
    - eval_config.policy_runner.action.delta=0
    - eval_config.eval_args.task=libero_90.kitchen_scene1_put_the_black_bowl_on_the_plate
    - eval_config.eval_args.max_step=300
    - eval_config.eval_args.num_envs=1
    - eval_config.eval_args.sim=mujoco
    - eval_config.eval_args.level=0
    - +eval_config.eval_args.max_demo=50
    - +eval_config.eval_args.downsample_ratio=4
    - train_config.training_params.max_train_steps=250
    - train_config.training_params.checkpoint_every_n_steps=1250
