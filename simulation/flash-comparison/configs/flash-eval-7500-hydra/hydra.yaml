    - train_config.training_params.seed=42
    - logging.mode=disabled
  job:
    name: train
    chdir: null
    override_dirname: +eval_config.eval_args.downsample_ratio=4,+eval_config.eval_args.max_demo=50,dataset_config.zarr_path=./data_policy/libero_90.kitchen_scene1_put_the_black_bowl_on_the_plateFrankaL0_obs:joint_pos_act:joint_pos_ds4_40.zarr,eval_config.eval_args.level=0,eval_config.eval_args.max_step=300,eval_config.eval_args.num_envs=1,eval_config.eval_args.sim=mujoco,eval_config.eval_args.task=libero_90.kitchen_scene1_put_the_black_bowl_on_the_plate,eval_config.policy_runner.action.action_type=joint_pos,eval_config.policy_runner.action.delta=0,eval_config.policy_runner.obs.obs_type=joint_pos,eval_enable=True,eval_path=./il_outputs/flash/libero_90.kitchen_scene1_put_the_black_bowl_on_the_plate/flash_bowl_s42_v1_20261028/checkpoints/7500.ckpt,exp_name=flash_bowl_s42_v1_20261028,logging.mode=disabled,task_name=libero_90.kitchen_scene1_put_the_black_bowl_on_the_plate,train_config.training_params.checkpoint_every_n_steps=1250,train_config.training_params.device=0,train_config.training_params.max_train_steps=250,train_config.training_params.num_epochs=100,train_config.training_params.num_steps=15000,train_config.training_params.resume=False,train_config.training_params.seed=42,train_config.training_params.seed=42,train_config.val_dataloader.batch_size=8,train_enable=False
    id: ???
    num: ???
    config_name: default_runner.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/hanyu/flash_fr3/flash_sim_reproduction_20261028/FLASH-Policy
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/hanyu/flash_fr3/flash_sim_reproduction_20261028/FLASH-Policy/roboverse_learn/il/configs
